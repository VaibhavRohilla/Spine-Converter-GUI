<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="viewer.css" />
    <title>Spine session</title>
  </head>
  <body>
    <div id="identity"></div>
    <canvas id="canvas"></canvas>
    <div id="controls">
      <select id="animation" aria-label="Animation"></select
      ><button id="play">Play</button><button id="pause">Pause</button
      ><button id="stop">Setup pose</button><button id="restart">Restart</button
      ><button id="step">Step 1/60</button
      ><label>Loop<input id="loop" type="checkbox" checked /></label
      ><label
        >Speed<input
          id="speed"
          type="number"
          value="1"
          min="0"
          max="4"
          step="0.1" /></label
      ><label
        >Time<input
          id="time"
          type="number"
          value="0"
          min="0"
          max="600"
          step="0.016666667" /></label
      ><button id="seek">Seek</button
      ><select id="skin" aria-label="Skin"></select
      ><label
        >Mix<input
          id="mix"
          type="number"
          value="0"
          min="0"
          max="10"
          step="0.1" /></label
      ><button id="fit">Fit</button
      ><label>Debug<input id="debug" type="checkbox" /></label
      ><button id="capture">Capture PNG</button
      ><button id="pose">Capture pose</button
      ><button id="dispose">Dispose</button>
    </div>
    <pre id="status">Loading</pre>
    <pre id="diagnostics"></pre>
    <script type="module" src="frame.js"></script>
  </body>
</html>
